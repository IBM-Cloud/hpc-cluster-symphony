name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  TERRAFORM_VERSION: '1.5.0'

jobs:
  # Code Quality and Security Checks
  quality-checks:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python code formatting check
        run: |
          black --check resources/ tests/
          isort --check-only resources/ tests/

      - name: Run Python linting
        run: |
          flake8 resources/ tests/
          pylint resources/**/*.py

      - name: Run Python security scan
        run: |
          bandit -r resources/ -f json -o bandit-report.json
          safety check

      - name: Upload Python security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: python-security-reports
          path: |
            bandit-report.json

  # Terraform Validation and Security
  terraform-checks:
    name: Terraform Validation & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3
        with:
          tflint_version: latest

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - name: Run Terrascan
        uses: tenable/terrascan-action@main
        with:
          iac_type: terraform
          iac_dir: .
          policy_type: all
          only_warn: true
          sarif_upload: false

      - name: Upload Terraform security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: terraform-security-reports
          path: |
            checkov-report.json

  # Python Unit Tests
  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    needs: [quality-checks]
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=resources --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml

  # Integration Tests (with IBM Cloud)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [terraform-checks, python-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: integration
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        env:
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          TF_VAR_api_key: ${{ secrets.IBM_CLOUD_API_KEY }}
        run: |
          pytest tests/integration/ -v --tb=short
        timeout-minutes: 30

  # Security Scan Summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [quality-checks, terraform-checks]
    if: always()
    steps:
      - name: Download security reports
        uses: actions/download-artifact@v3
        with:
          path: security-reports

      - name: Generate security summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Python Security (Bandit)" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/python-security-reports/bandit-report.json ]; then
            echo "✅ Bandit scan completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Bandit scan failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Terraform Security (Checkov)" >> $GITHUB_STEP_SUMMARY
          if [ -f security-reports/terraform-security-reports/checkov-report.json ]; then
            echo "✅ Checkov scan completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Checkov scan failed" >> $GITHUB_STEP_SUMMARY
          fi
